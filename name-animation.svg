<svg
  width="100%"
  height="190"
  viewBox="0 0 1000 190"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>

    <!-- Name Gradient -->
    <linearGradient id="nameGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- ================= GREETING ================= -->

  <text
    x="500"
    y="48"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="22"
    font-weight="600"
    fill="#94A3B8"
  >
    ✦ Welcome to my little corner of code ✦
  </text>


  <!-- ================= NAME ================= -->

  <text
    x="500"
    y="88"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="30"
    font-weight="700"
    letter-spacing="1"
    fill="url(#nameGradient)"
    filter="url(#glow)"
  >
    Nazifa Nowsin
  </text>


  <!-- ================= ANIMATED TITLES ================= -->

  <g
    font-family="Arial, Helvetica, sans-serif"
    font-size="21"
    font-weight="700"
    font-style="italic"
    text-anchor="middle"
  >

    <!-- Title 1 -->

    <text
      x="500"
      y="132"
      fill="#67E8F9"
      opacity="0"
    >
      Enthusiastic Web Developer

      <animate
        attributeName="opacity"
        values="0;1;1;0"
        keyTimes="0;0.12;0.30;0.42"
        dur="8s"
        repeatCount="indefinite"
      />
    </text>


    <!-- Title 2 -->

    <text
      x="500"
      y="132"
      fill="#A5B4FC"
      opacity="0"
    >
      MERN Stack Developer

      <animate
        attributeName="opacity"
        values="0;1;1;0"
        keyTimes="0;0.42;0.54;0.66"
        dur="8s"
        repeatCount="indefinite"
      />
    </text>


    <!-- Title 3 -->

    <text
      x="500"
      y="132"
      fill="#F9A8D4"
      opacity="0"
    >
      Problem Solver

      <animate
        attributeName="opacity"
        values="0;1;1;0"
        keyTimes="0;0.66;0.78;0.90"
        dur="8s"
        repeatCount="indefinite"
      />
    </text>


    <!-- Title 4 -->

    <text
      x="500"
      y="132"
      fill="#86EFAC"
      opacity="0"
    >
      Continuous Learner

      <animate
        attributeName="opacity"
        values="0;1;1;0"
        keyTimes="0;0.90;0.96;1"
        dur="8s"
        repeatCount="indefinite"
      />
    </text>

  </g>


  <!-- ================= DECORATIVE LINE ================= -->

  <line
    x1="350"
    y1="155"
    x2="650"
    y2="155"
    stroke="url(#nameGradient)"
    stroke-width="1.5"
    opacity="0.45"
  >

    <animate
      attributeName="x1"
      values="420;350;420"
      dur="4s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="x2"
      values="580;650;580"
      dur="4s"
      repeatCount="indefinite"
    />

  </line>


  <!-- ================= SMALL TAGLINE ================= -->

  <text
    x="500"
    y="180"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="12"
    font-style="italic"
    fill="#64748B"
  >
    Learn • Build • Improve • Grow
  </text>

</svg>
