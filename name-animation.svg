<svg
  width="100%"
  height="190"
  viewBox="0 0 1000 190"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>

    <!-- Name Gradient -->
    <linearGradient id="nameGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- ================= GREETING ================= -->

  <text
    x="500"
    y="43"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="20"
    font-weight="600"
    fill="#94A3B8"
  >
    ✦ Welcome to my little corner of code ✦
  </text>


  <!-- ================= NAME ================= -->

  <text
    x="500"
    y="84"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="29"
    font-weight="700"
    letter-spacing="1"
    fill="url(#nameGradient)"
    filter="url(#glow)"
  >
    Nazifa Nowsin
  </text>


  <!-- ================================================= -->
  <!--                 ANIMATED TITLES                  -->
  <!-- ================================================= -->

  <!-- Enthusiastic Web Developer -->

  <text
    x="500"
    y="128"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="21"
    font-weight="700"
    font-style="italic"
    fill="#67E8F9"
  >
    Enthusiastic Web Developer

    <animate
      attributeName="opacity"
      dur="16s"
      repeatCount="indefinite"
      values="1;1;0;0;0;1"
      keyTimes="0;0.18;0.24;0.25;0.99;1"
    />

  </text>


  <!-- MERN Stack Developer -->

  <text
    x="500"
    y="128"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="21"
    font-weight="700"
    font-style="italic"
    fill="#A78BFA"
    opacity="0"
  >
    MERN Stack Developer

    <animate
      attributeName="opacity"
      dur="16s"
      repeatCount="indefinite"
      values="0;0;1;1;0;0"
      keyTimes="0;0.24;0.25;0.43;0.49;1"
    />

  </text>


  <!-- Problem Solver -->

  <text
    x="500"
    y="128"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="21"
    font-weight="700"
    font-style="italic"
    fill="#F472B6"
    opacity="0"
  >
    Problem Solver

    <animate
      attributeName="opacity"
      dur="16s"
      repeatCount="indefinite"
      values="0;0;1;1;0;0"
      keyTimes="0;0.49;0.50;0.68;0.74;1"
    />

  </text>


  <!-- Continuous Learner -->

  <text
    x="500"
    y="128"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="21"
    font-weight="700"
    font-style="italic"
    fill="#86EFAC"
    opacity="0"
  >
    Continuous Learner

    <animate
      attributeName="opacity"
      dur="16s"
      repeatCount="indefinite"
      values="0;0;1;1;0;0"
      keyTimes="0;0.74;0.75;0.93;0.99;1"
    />

  </text>


  <!-- ================= DECORATIVE LINE ================= -->

  <line
    x1="365"
    y1="151"
    x2="635"
    y2="151"
    stroke="url(#nameGradient)"
    stroke-width="1.5"
    opacity="0.45"
  />


  <!-- ================= SMALL TAGLINE ================= -->

  <text
    x="500"
    y="176"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="12"
    font-style="italic"
    fill="#64748B"
  >
    Learn • Build • Improve • Grow
  </text>

</svg>
